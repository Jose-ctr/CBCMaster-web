<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBC MASTER</title><style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#4b4b4b;
}

.header{
  background:#111827;
  color:white;
  padding:16px;
  display:flex;
  align-items:center;
  font-size:22px;
  font-weight:bold;
}

.menu{
  font-size:28px;
  margin-right:16px;
  cursor:pointer;
}

.accent{
  height:5px;
  background:#0F766E;
}

.container{
  padding:14px;
}

.section-title{
  background:white;
  color:#0F766E;
  padding:14px;
  font-weight:bold;
  border-radius:6px;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:10px;
  padding:22px;
  margin-bottom:18px;
  font-size:20px;
  font-weight:bold;
  color:#111827;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.card small{
  color:#6b7280;
  display:block;
  margin-top:6px;
  font-weight:normal;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#0F766E;
  color:white;
  font-size:16px;
  margin-top:12px;
}

button:hover{
  background:#115E59;
}

input, select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:10px;
  margin-top:10px;
  box-sizing:border-box;
}

.result{
  background:#ecfeff;
  border:1px solid #0F766E;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
  display:none;
}

.history-item{
  background:#f8fafc;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  font-size:14px;
}

.pay-btn{
  display:block;
  text-align:center;
  background:#16A34A;
  color:white;
  text-decoration:none;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
  font-weight:bold;
}
</style></head><body><div class="header">
  <div class="menu">☰</div>
  CBC MASTER
</div><div class="accent"></div><div class="container">  <div class="section-title">1. QUESTION AND ANSWER</div>  <div class="card">
    01 NOTES
    <small>Grade 4–6 revision notes</small>
  </div>  <div class="card">
    02 QUIZZES
    <small>Practice CBC questions</small><input id="student" placeholder="Student Name">

<select id="grade">
  <option value="4">Grade 4</option>
  <option value="5">Grade 5</option>
  <option value="6">Grade 6</option>
</select>

<button onclick="startQuiz()">Start Quiz</button>

<div id="result" class="result"></div>

  </div>  <div class="card">
    03 PROGRESS HISTORY
    <small>Saved results for this phone</small><button onclick="showHistory()">View History</button>
<div id="historyBox"></div>

  </div>  <div class="card">
    04 LEADERBOARD
    <small>Top recent scores</small>
    <div id="leaderboardBox"></div>
  </div>  <div class="card">
    05 PREMIUM ACTIVATION
    <small>Unlock all questions and future updates</small><p><strong>Price:</strong> KSh 300</p>
<p><strong>M-Pesa:</strong> 0707649890</p>

<a class="pay-btn"
   href="https://wa.me/254707649890?text=Hello%20Joseph,%20I%20want%20to%20activate%20CBC%20MASTER">
   💳 Pay via M-Pesa
</a>

  </div>  <div class="card">
    06 CONTACT SUPPORT
    <small>WhatsApp support and activation</small><p>📱 0707649890</p>
<p>📧 mbuijoseph51@gmail.com</p>

<a class="pay-btn"
   href="https://wa.me/254707649890">
   💬 WhatsApp Support
</a>

  </div></div><script>
function saveHistory(student, grade, score, total){
  const history = JSON.parse(localStorage.getItem('cbc_history') || '[]');

  history.push({
    student: student,
    grade: grade,
    score: score,
    total: total,
    percent: Math.round(score/total*100),
    date: new Date().toLocaleString()
  });

  localStorage.setItem('cbc_history', JSON.stringify(history));
}

function startQuiz(){
  const student = document.getElementById('student').value || 'Student';
  const grade = document.getElementById('grade').value;

  let score = 0;
  let total = 2;

  const q1 = prompt('Grade ' + grade + ' Math: 345 + 129 = ?');
  if(q1 === '474') score++;

  const q2 = prompt('Grade ' + grade + ' Social Studies: Capital city of Kenya?');
  if(q2 && q2.toLowerCase().trim() === 'nairobi') score++;

  saveHistory(student, grade, score, total);

  const percent = Math.round(score/total*100);

  const box = document.getElementById('result');
  box.style.display = 'block';

  if(percent >= 50){
    box.innerHTML = '✅ Excellent ' + student + '! Score: ' + score + '/' + total + ' (' + percent + '%)';
  }else{
    box.innerHTML = '❌ Keep practicing ' + student + '. Score: ' + score + '/' + total + ' (' + percent + '%)';
  }

  showLeaderboard();
}

function showHistory(){
  const history = JSON.parse(localStorage.getItem('cbc_history') || '[]');
  const box = document.getElementById('historyBox');

  if(history.length === 0){
    box.innerHTML = '<p>No history saved yet.</p>';
    return;
  }

  let html = '';

  history.slice().reverse().forEach((h, i) => {
    html += '<div class="history-item">' +
      '<strong>' + (i+1) + '. ' + h.student + '</strong><br>' +
      'Grade: ' + h.grade + '<br>' +
      'Score: ' + h.score + '/' + h.total + ' (' + h.percent + '%)<br>' +
      'Date: ' + h.date +
      '</div>';
  });

  box.innerHTML = html;
}

function showLeaderboard(){
  const history = JSON.parse(localStorage.getItem('cbc_history') || '[]');
  const box = document.getElementById('leaderboardBox');

  if(history.length === 0){
    box.innerHTML = '<p>No scores yet.</p>';
    return;
  }

  history.sort((a,b)=>b.percent-a.percent);

  let html = '';

  history.slice(0,5).forEach((h,i)=>{
    html += '<div class="history-item">🏆 ' + (i+1) + '. ' + h.student + ' - ' + h.percent + '%</div>';
  });

  box.innerHTML = html;
}

showLeaderboard();
</script></body>
</html><!DOCTYPE html><html lang="en">
